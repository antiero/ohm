[package]
name = "ohm-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# C ABI used by Noodlr's AudioWorklet host (src/worklet.rs)
worklet = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strum = "0.28.0"
strum_macros = "0.28"
anyhow = "1.0.104"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
